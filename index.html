<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Refugios de Cortés</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/MarkerCluster.Default.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🏘️ Mapa de Refugios de Cortés</h1>
                <p class="subtitle">Refugios oficiales del departamento de Cortés</p>
            </div>
            <div class="header-controls">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar refugio...">
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mapa -->
            <div id="map" class="map-container"></div>
            
            <!-- Sidebar con información -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Refugios</h2>
                    <span class="refugios-count" id="refugiosCount">0</span>
                </div>
                <div class="refugios-list" id="refugiosList">
                    <p class="loading">Cargando refugios...</p>
                </div>
                <div class="sidebar-footer">
                    <button class="report-button" id="reportButton">📋 Reportar</button>
                </div>
            </aside>
        </main>
    </div>

    <!-- Modal de Reporte -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nuevo Reporte</h2>
                <button class="close-button" id="closeReportModal">&times;</button>
            </div>
            <form id="reportForm" class="report-form">
                <div class="form-group">
                    <label for="reportType">Tipo de Reporte *</label>
                    <select id="reportType" name="reportType" required>
                        <option value="">-- Selecciona un tipo --</option>
                        <option value="problema">Problema con el refugio</option>
                        <option value="informacion">Información incorrecta</option>
                        <option value="sugerencia">Sugerencia o mejora</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reportDescription">Descripción *</label>
                    <textarea 
                        id="reportDescription" 
                        name="reportDescription" 
                        rows="4" 
                        placeholder="Describe el problema o sugerencia en detalle..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="reportName">Nombre (Opcional)</label>
                    <input 
                        type="text" 
                        id="reportName" 
                        name="reportName" 
                        placeholder="Tu nombre"
                    >
                </div>

                <div class="form-group">
                    <label for="reportEmail">Correo (Opcional)</label>
                    <input 
                        type="email" 
                        id="reportEmail" 
                        name="reportEmail" 
                        placeholder="tu.email@ejemplo.com"
                    >
                </div>

                <!-- Sección de fotografías -->
                <div class="form-group">
                    <label for="reportPhotos">Fotografías (Opcional)</label>
                    <div class="file-upload-area" id="fileUploadArea">
                        <input 
                            type="file" 
                            id="reportPhotos" 
                            name="reportPhotos" 
                            multiple
                            accept="image/jpeg,image/jpg,image/png,image/webp"
                            style="display: none;"
                        >
                        <div class="upload-placeholder">
                            <p>📸 Arrastra imágenes aquí o haz clic para seleccionar</p>
                            <p style="font-size: 12px; color: #7f8c8d;">JPG, JPEG, PNG o WEBP (máx. 5MB por imagen, hasta 5 imágenes)</p>
                        </div>
                    </div>
                    <div class="photo-preview" id="photoPreview"></div>
                </div>

                <div class="form-actions">
                    <button type="button" class="button-cancel" id="cancelReportBtn">Cancelar</button>
                    <button type="submit" class="button-submit" id="submitReportBtn">Enviar Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast de notificaciones -->
    <div id="toast" class="toast"></div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.4.1/leaflet.markercluster.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
    
    <!-- Custom Scripts -->
    <script src="js/refugios.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/reporte.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
